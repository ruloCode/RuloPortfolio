<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="rulocode">
  <title>rulocode</title>
  <!-- Placa: favicon, icono de app y tarjeta de OG. Misma geometría exacta,
       escalada al 88 % y centrada para dejar el aire que pide un icono
       redondeado. Quieta a propósito: un favicon que se mueve distrae, y el
       generador de OG rasteriza sin ejecutar CSS. -->
  <rect width="64" height="64" rx="15" fill="#08533C"/>
  <g transform="translate(3.84 3.84) scale(.88)">
    <path d="M49 15C41 21 39.5 28 39.5 37" fill="none" stroke="#F4F1EA" stroke-width="9" stroke-linecap="round"/>
    <path d="M39.5 37A12.5 12.5 0 1 1 22.7 25.3" fill="none" stroke="#7FD9B9" stroke-width="10.5" stroke-linecap="round"/>
  </g>
</svg>
