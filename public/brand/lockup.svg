  <title>rulocode</title>
  <!-- Lockup horizontal. La palabra va trazada a curvas (Space Grotesk 700,
       tracking -0,02 em), así que el archivo no depende de ninguna fuente
       instalada: se ve igual en un patrocinio, un PDF o una camiseta.

       ÁREA DE RESPETO: X = 16 unidades de la retícula de 64 de la marca, o sea
       un cuarto de su caja (en la práctica: el alto de la marca dividido 2,77).
       Nada entra a menos de X por ningún lado, y X es también el hueco entre
       el símbolo y la palabra. Para calcularlo a cualquier tamaño:
       X = alto_del_lockup x 0,36. -->
