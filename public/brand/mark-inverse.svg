<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="rulocode">
  <title>rulocode</title>
  <!-- Misma geometría, para fondo tinta. El verde sube a #7FD9B9 porque el
       #08533C sobre negro casi no levanta. Quieta: la inversa vive en sitios
       donde nadie espera movimiento (firmas, patrocinios, fondos oscuros). -->
  <path d="M49 15C41 21 39.5 28 39.5 37" fill="none" stroke="#F4F1EA" stroke-width="9" stroke-linecap="round"/>
  <path d="M39.5 37A12.5 12.5 0 1 1 22.7 25.3" fill="none" stroke="#7FD9B9" stroke-width="10.5" stroke-linecap="round"/>
</svg>
