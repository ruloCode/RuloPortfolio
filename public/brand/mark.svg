<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="rulocode">
  <title>rulocode</title>
  <!-- El flujo: una tarea entra abajo a la izquierda, pasa por el nodo del
       medio y sale arriba. Geometría afinada sobre los conceptos generados
       con Higgsfield; entregada en vector para que sea nítida a 16 px.
       La animación vive DENTRO del archivo, así corre igual incrustado con
       <img> (la barra del mundo) que en línea.

       Ojo con el estado de reposo: el logo COMPLETO es el estado normal y la
       animación usa fill-mode backwards para esconderlo solo mientras corre.
       Al revés (esconder en el CSS y revelar al animar) el logo desaparece
       en cualquier contexto que no ejecute animaciones — un render estático,
       un PDF, una firma de correo. -->
  <style>
    .flow { animation: draw 1.1s cubic-bezier(.4,0,.2,1) .15s backwards; }
    .node { animation: pop .4s cubic-bezier(.34,1.56,.64,1) backwards; }
    .mid  { transform-origin: 32px 32px; animation-delay: .72s; }
    .end  { transform-origin: 49px 15px; animation-delay: 1.02s; }
    .spark { opacity: 0; animation: blink 4.4s linear 1.7s infinite; }
    @keyframes draw  { from { stroke-dasharray: 58; stroke-dashoffset: 58 } to { stroke-dasharray: 58; stroke-dashoffset: 0 } }
    @keyframes pop   { from { opacity: 0; transform: scale(.35) } to { opacity: 1; transform: scale(1) } }
    @keyframes blink { 0% { opacity: 0 } 5% { opacity: .95 } 58% { opacity: .95 } 70%,100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .node { animation: none }
      .spark { display: none }
    }
  </style>
  <path id="flow" class="flow" d="M15 49C15 36 28 36 32 32C36 28 49 28 49 15" fill="none" stroke="#08533C" stroke-width="6" stroke-linecap="round"/>
  <circle cx="15" cy="49" r="6" fill="#08533C"/>
  <circle class="node mid" cx="32" cy="32" r="6.5" fill="#3E9276"/>
  <circle class="node end" cx="49" cy="15" r="6" fill="#111110"/>
  <circle class="spark" r="3" fill="#111110">
    <animateMotion dur="4.4s" begin="1.7s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.05;0.62;1" calcMode="linear">
      <mpath href="#flow"/>
    </animateMotion>
  </circle>
</svg>
