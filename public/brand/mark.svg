<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="rulocode">
  <title>rulocode</title>
  <!-- El rulo. Una línea recta entra en tinta y se convierte en bucle verde:
       «rulo» es el rizo y es el bucle, y un bucle es lo que hace el trabajo
       por ti. Un solo gesto, dos pesos (cola 9, bucle 10,5) para que a 16 px
       no se fundan en una mancha.

       QUIETA, Y A PROPÓSITO. La versión anterior llevaba la animación dentro
       del archivo. Se cayó en una prueba real: Chrome headless rasteriza el
       SVG de un <img> sin esperar a que su línea de tiempo termine, y la
       cabecera salía como un punto negro — el trazo apenas empezado. Eso le
       pasa a cualquier captura automática: previsualizaciones de enlaces,
       PDF, scrapers. Un archivo de marca tiene que dar SIEMPRE el mismo
       resultado, corra o no corra el CSS.

       El movimiento vive donde se puede controlar: src/components/BrandSplash
       dibuja esta misma geometría al entrar al sitio, una vez por sesión. -->
  <path d="M49 15C41 21 39.5 28 39.5 37" fill="none" stroke="#111110" stroke-width="9" stroke-linecap="round"/>
  <path d="M39.5 37A12.5 12.5 0 1 1 22.7 25.3" fill="none" stroke="#08533C" stroke-width="10.5" stroke-linecap="round"/>
</svg>
